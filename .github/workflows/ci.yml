name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & verify artifacts are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # jsdom (tests) and esbuild (minifier) — the framework itself ships zero deps.
      - name: Install dev dependencies
        run: npm ci

      # src/nyx.css / src/nyx.js are the source of truth; build.js regenerates
      # dist/components/*.css, the minified distribution, and dist/manifest.json.
      # This runs BEFORE the tests: the manifest suite asserts against the
      # generated artifacts, so building second would test a stale tree.
      - name: Build
        run: node build.js

      # The package must be loadable outside a browser: SSR renders and plain
      # `require()` evaluate the runtime with no `document`.
      - name: Import without a DOM
        run: |
          node -e "const N=require('./src/nyx.js'); if(!N.version) throw new Error('no export')"
          node -e "const N=require('./dist/nyx.min.js'); if(!N.version) throw new Error('no export')"
          node --input-type=module -e "const m=await import('./dist/nyx.mjs'); if(!m.default.version) throw new Error('no default export')"

      # Behavioural tests: load the runtime in jsdom and exercise the API.
      - name: Test
        run: npm test

      # If a regenerated artifact differs from what's committed, the bundle and
      # the à-la-carte / minified files have drifted — fail and ask for a rebuild.
      - name: Verify no drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build artifacts are out of sync with src/nyx.css / src/nyx.js."
            echo "Run 'node build.js' locally and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "✓ dist/ artifacts match a fresh build."
